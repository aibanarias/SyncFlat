<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>IW: Perfil</title>
</head>

<body class="d-flex flex-column h-100">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0">
        <div class="container">
            <h1 class="mt-5">Perfil de <span th:text="${user.username}">Usuario</span></h1>

            <div class="row mt-4">
                <div class="col-md-4">
                    <img th:src="@{/user/__${user.id}__/pic}" alt="Foto de perfil"
                         class="img-thumbnail rounded-circle" style="width:180px;height:180px;object-fit:cover;" />
                    <form th:action="@{/user/__${user.id}__/pic}" method="post" enctype="multipart/form-data" class="mt-2">
                        <input type="file" name="photo" id="f_avatar" accept="image/jpeg,image/png" class="form-control" />
                        <button type="submit" class="btn btn-outline-secondary btn-sm mt-1">Cambiar foto</button>
                    </form>
                </div>
                <div class="col-md-8">
                    <!-- envío de mensajes directos -->
                    <div class="py-3" id="mensajes"></div>
                    <div class="py-3">
                        <form th:action="@{/user/__${user.id}__/msg}" method="POST">
                            <input type="text" id="message" class="form-control" placeholder="Escribe a este usuario" />
                            <button id="sendmsg" class="btn btn-secondary mt-2" type="submit">Enviar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer.html :: footer}" />

    <script th:src="@{/js/ajax-demo.js}"></script>
</body>

</html>
