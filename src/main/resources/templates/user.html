<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>IW: Perfil</title>
</head>

<body class="d-flex flex-column h-100">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0">
        <div class="container mt-4" style="max-width: 700px;">
            <h1 class="mb-4">Perfil de <span th:text="${user.username}">Usuario</span></h1>

            <div class="card">
                <div class="card-body">
                    <div class="row g-4">
                        <div class="col-md-4 text-center">
                            <img th:src="@{/user/__${user.id}__/pic}" alt="Foto de perfil"
                                 class="rounded-circle mb-3" style="width:140px;height:140px;object-fit:cover;border:3px solid #dee2e6;" />
                            <form th:action="@{/user/__${user.id}__/pic}" method="post" enctype="multipart/form-data">
                                <input type="file" name="photo" id="f_avatar" accept="image/jpeg,image/png" class="form-control form-control-sm mb-2" />
                                <button type="submit" class="btn btn-outline-secondary btn-sm w-100">
                                    <i class="bi bi-camera me-1"></i> Cambiar foto
                                </button>
                            </form>
                        </div>
                        <div class="col-md-8">
                            <h6 class="fw-semibold mb-3">Enviar mensaje</h6>
                            <div class="mb-3" id="mensajes"></div>
                            <form th:action="@{/user/__${user.id}__/msg}" method="POST">
                                <div class="mb-2">
                                    <input type="text" id="message" class="form-control" placeholder="Escribe a este usuario" />
                                </div>
                                <button id="sendmsg" class="btn btn-primary btn-sm" type="submit">
                                    <i class="bi bi-send me-1"></i> Enviar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer.html :: footer}" />

    <script th:src="@{/js/ajax-demo.js}"></script>
</body>

</html>
