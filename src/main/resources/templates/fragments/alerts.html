<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>alerts fragment</title></head>
<body>
<div th:fragment="alerts">
    <div th:if="${flashSuccess}"
         class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${flashSuccess}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${flashError}"
         class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${flashError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${flashWarning}"
         class="alert alert-warning alert-dismissible fade show" role="alert">
        <span th:text="${flashWarning}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>
</body>
</html>
